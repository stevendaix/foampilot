name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install foampilot
        run: |
          pip install -e .

      - name: Check architecture
        run: |
          python tools/audit/check_architecture.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install foampilot
        run: |
          pip install -e .
          pip install pytest

      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest test/ -v