name: Marine portability

on:
  pull_request:
    paths:
      - "foampilot/**"
      - "openfoam13/**"
      - "src/**"
      - "test_cfd_methods.py"
      - ".github/workflows/marine-portability.yml"
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "foampilot/**"
      - "openfoam13/**"
      - "src/**"
      - "test_cfd_methods.py"
      - ".github/workflows/marine-portability.yml"

permissions:
  contents: read

jobs:
  python-marine:
    name: Python marine tests and portability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foampilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: foampilot/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest numpy
      - name: Compile Python sources
        run: python -m compileall -q src test
      - name: Run marine unit tests
        run: PYTHONPATH=src python -m pytest -q test/test_marine_*.py

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject tracked Python bytecode
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(__pycache__/.*\.pyc$|.*\.pyc$)'; then
            echo "Tracked Python bytecode is not allowed" >&2
            exit 1
          fi
      - name: Reject machine-local paths in marine validation files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            foampilot/test/run_foundation13_case_validation.py
            foampilot/test/validate_converted_foundation13.py
            test_cfd_methods.py
            src/launch_compile.sh
          )
          if grep -nHE '/home/(ubuntu|steven)|/opt/openfoam|/OpenFOAM-[0-9]' "${files[@]}"; then
            echo "Machine-local path found in a marine validation file" >&2
            exit 1
          fi
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(git ls-files -- '*.sh' '*.bash')
